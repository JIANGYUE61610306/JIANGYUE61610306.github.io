# =========================
# Minimal Mistakes + AcademicPages 基础配置（可直接用）
# =========================
locale: "en-US"

# 主题（AcademicPages 基于 Minimal Mistakes）
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default"   # 可选: air, aqua, contrast, dark, default, neon 等

# 站点信息
title: "Jiang Yue / Homepage"
name: "Jiang Yue"
description: "Spatio-Temporal Deep Learning · Time Series · Urban Computing"

# 重要：用户主页域名（不要带仓库路径，也不要末尾斜杠）
url: "https://jiangyue61610306.github.io"
# 用户主页无子路径，保持空
baseurl: ""

# “用户名/仓库名” 格式
repository: "JIANGYUE61610306/JIANGYUE61610306.github.io"

# -------------------------
# 作者信息（侧边栏/卡片）
# -------------------------
author:
  avatar: "profile.jpg"   # 放在 /images/ 目录下
  name: "Jiang Yue"
  pronouns: "He/His"
  bio: "AI — a love for life."
  location: "Singapore (SPR)"
  email: "yue013@e.ntu.edu.sg"

  # 学术/外链
  googlescholar: "https://scholar.google.com/citations?user=lXC_ufAAAAAJ&hl=en"
  orcid: "https://orcid.org/0009-0002-3891-365X"
  github: "JIANGYUE61610306"

  # 其他留空即可（留空不会显示）
  linkedin:
  twitter:
  mastodon:
  zhihu:

# -------------------------
# 页面/集合
# -------------------------
collections:
  publications:
    output: true
    permalink: /publications/:path/
  portfolio:
    output: true
    permalink: /projects/:path/
  talks:
    output: true
    permalink: /talks/:path/
  teaching:
    output: true
    permalink: /teaching/:path/

# 分类名（按需）
publication_category:
  books:
    title: "Books"
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"
  preprints:
    title: "Arxiv Papers"

# -------------------------
# 页面默认参数（Minimal Mistakes）
# -------------------------
defaults:
  # 博文
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # 页面
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      comments: false
      share: true
  # portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      comments: false
      share: true
  # talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      comments: false
      share: true

# -------------------------
# 插件
# -------------------------
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-gist
  - jemoji
  - jekyll-include-cache

# -------------------------
# 站点其它设置
# -------------------------
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
timezone: Etc/UTC

# 导航（把这些页面加入顶栏；确保这些文件存在）
# 例如：_pages/about.md, _pages/publications.md, _pages/cv.md
header_pages:
  - _pages/about.md
  - _pages/publications.md
  - _pages/cv.md

# feed / seo 等
atom_feed:
  hide: false

# 读取/忽略
include:
  - _pages
exclude:
  - .github
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - README
  - tmp
  - log

# SASS
sass:
  sass_dir: _sass
  style: compressed

# 可选：站点速度优化（Minimal Mistakes 推荐）
compress_html:
  clippings: all
  ignore:
    envs: development

# 社交分享/统计（可留空）
analytics:
  provider: "false"
twitter:
  username:
facebook:
  username:
